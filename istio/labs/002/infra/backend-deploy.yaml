apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:0.2.3
          args: ["-text=backend"]
          ports:
            - containerPort: 5678
          resources:
            requests: # Minimum resources needed by the container
              cpu: "100m"
              memory: "128Mi"
            limits: # Maximum resources the container can use
              cpu: "200m"
              memory: "256Mi"
