apiVersion: newrelic.com/v1alpha2
kind: Instrumentation
metadata:
  name: newrelic-instrumentation
  namespace: newrelic
spec:
  agent:
    # Values supported: dotnet, java, nodejs, python, ruby, php
    language: java

    # Values supported: newrelic-java-init:latest, newrelic-dotnet-init:latest, newrelic-node-init:latest, newrelic-python-init:latest, newrelic-ruby-init:latest, newrelic-php-init:latest, newrelic-php-init:musl
    image: newrelic/newrelic-java-init:latest
    env:
      # Example overriding the appName configuration, neste exemplo utiliza o nome do deployment
      - name: NEW_RELIC_APP_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.labels['app.kubernetes.io/name']
      # Nao eh necessario pois o webhook do new relic ja injeta essa variavel para pegar a license key de um secret
      #- name: NEW_RELIC_LICENSE_KEY
      #  valueFrom:
      #    secretKeyRef:
      #      name: newrelic-key-secret
      #      key: new_relic_license_key

  # Select a namespace with a specific name by using "kubernetes.io/metadata.name" label
  namespaceLabelSelector:
    matchExpressions:
      - key: "kubernetes.io/metadata.name"
        operator: "In"
        values: ["labs"]

  # podLabelSelector:
  #   matchExpressions:
  #     - key: "app.kubernetes.io/name"
  #       operator: "In"
  #       values: ["app1"]
