apiVersion: v1
kind: Service
metadata:
  name: k8s-dashboard-lb
  namespace: kubernetes-dashboard
  annotations:
    service.beta.kubernetes.io/vultr-loadbalancer-protocol: "https"
    service.beta.kubernetes.io/vultr-loadbalancer-label: "k8s-dashboard-lb"    
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: k8s-dashboard
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
