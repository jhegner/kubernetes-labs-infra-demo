apiVersion: v1
kind: ConfigMap
metadata:
  name: app-micronout-config
  namespace: labs
  labels:
    projeto: projeto-k3d-local
    app: app-micronout
    team: devops
    env: lab
data:
  MOCKAPI_PATH_PREFIX: mockapi.io
  MOCKAPI_VERSION: api/v1

---
apiVersion: v1
kind: Secret
metadata:
  name: mockapi-project-secret
  namespace: labs
type: Opaque
stringData:
  MOCKAPI_PROJECT_SECRET: "689821adddf05523e55e2f5e"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-micronout-deploy
  namespace: labs
  labels:
    projeto: projeto-k3d-local
    app: app-micronout
    stack: micronaut
    team: devops
    env: lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "app-micronout"
  template:
    metadata:
      labels:
        projeto: projeto-k3d-local
        app: app-micronout
        stack: micronaut
        team: devops
        env: lab
    spec:
      containers:
        - name: app-micronout
          image: ewr.vultrcr.com/kuberneteslabcontainerregistry/kubernetes-labs-app-micronout:develop
          imagePullPolicy: Always
          resources:
            limits:
              memory: "800Mi"
              cpu: "500m"
            requests:
              memory: "400Mi"
              cpu: "250m"
          ports:
            - containerPort: 8080
          env:
            - name: MOCKAPI_PATH_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: app-micronout-config
                  key: MOCKAPI_PATH_PREFIX
            - name: MOCKAPI_VERSION
              valueFrom:
                configMapKeyRef:
                  name: app-micronout-config
                  key: MOCKAPI_VERSION
            - name: MOCKAPI_PROJECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mockapi-project-secret
                  key: MOCKAPI_PROJECT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: app-micronout-service
  namespace: labs
  labels:
    app: app-micronout
    component: api
    projeto: projeto-k3d-local
    team: devops
    env: lab
spec:
  selector:
    app: app-micronout
  ports:
    - name: http
      port: 80
      targetPort: 8080

