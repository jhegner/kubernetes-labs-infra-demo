apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labs-app-micronout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jhegner/kubernetes-labs-infra-demo.git
    targetRevision: argocd
    path: argo-cd/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: labs
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
